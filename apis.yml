name: Codafication
kind: company
description: >-
  Codafication is a Brisbane, Australia insurtech founded in 2015 by Daniel
  Sandaver and Drew Butler out of a property claims and repair construction business,
  building software for the general insurance claims supply chain rather than for
  underwriting or policy administration. Its three products are Crunchwork, a cloud
  claims and project management platform that acts as a control tower across insurers,
  assessors, builders, restorers and trades (tasks and workflow, report writer, quotes
  and variations, catalog, asset manager, purchase orders, invoices, finance, analytics,
  vendor manager, zones, tenants and teams, and Pulse); Virtual Assist, a real-time
  video streaming and virtual assessment tool used for remote triage of property
  claims; and Unity Cloud, the GraphQL data, extension and integration platform the
  other two products are built on. Unity Cloud does publish a public developer
  reference at docs.unitycloud.io - the Unity Platform SDK documentation - covering the
  Portal SDK (React), the Node.js Unity SDK, the GraphQL client, setQueries and
  setMutations, GraphQL links and type extensions, public and private REST endpoints
  served under a tenant Cloud domain, GraphQL-payload webhooks, before/after logic hooks,
  and the Twilio, SendGrid and Bitly platform services. Authentication is Auth0-backed
  (SAML 2.0 and Active Directory connections) with tenant-scoped role-based access
  control, plus Unity API tokens issued from the in-product Developer Portal and
  pre-shared extension secrets. What is missing is the self-serve layer: no OpenAPI or
  AsyncAPI definition, no public GraphQL introspection endpoint, no Postman collection,
  no public npm distribution of the SDKs, no status page and no self-serve signup -
  access runs through named enterprise engagements. Customers and partners include
  Insurance Australia Group (IAG, announced December 2025), Suncorp, Urban Utilities and
  the Australian Building and Construction Group, alongside a Guidewire partnership and
  SOC 2 Type II certification attained in January 2026. Australia has no live
  open-insurance obligation - the Consumer Data Right was designated to extend to general
  insurance and then deferred - so nothing forces this platform to open further than it
  already has.
