apis:
- name: Unity Platform API
  description: >-
    The Unity Cloud (Unity Platform) developer surface, documented publicly at
    docs.unitycloud.io as the Unity Platform SDK reference. A single GraphQL endpoint
    collates the schemas of every installed extension, with strongly typed where clauses,
    role-based access control and multi-tenancy applied by default. Extensions written
    against the Node.js Unity SDK register GraphQL queries, mutations, links and type
    extensions, and may additionally serve public and private REST endpoints under
    https://<CloudDomain>/graphql/v2/public/<extensionName>/<endpoint> and
    https://<CloudDomain>/graphql/v2/<extensionName>/<endpoint>. Events are exposed as
    webhooks whose payload is a GraphQL query executed at trigger time, and as
    before/after logic hooks bound to mutation names. No baseURL is recorded here on
    purpose - the host is the customer's own tenant Cloud domain, not a single shared
    production host, and none was fabricated.
  humanURL: https://docs.unitycloud.io/
