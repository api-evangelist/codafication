sources:
- url: https://blog.codafication.com/
  type: Blog
  note: Primary identity source - products, founders, customers, partnerships.
- url: https://support.codafication.com/en/
  type: SupportKnowledgeBase
  note: Primary product-surface source - modules, integrations, roles.
- url: https://github.com/Codafication
  type: GitHubOrganization
  note: Corroborates stack (GraphQL/Apollo, WebRTC/mediasoup, Xero, NetSuite) and
    Australian base; no API artifacts.
