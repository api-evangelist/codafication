  type: CertificateTransparency
  note: Full subdomain enumeration - seven hosts, none of them a developer or docs host.
limitations: |
  codafication.com and its application subdomains serve an anti-bot challenge to
  anonymous clients, so no first-party marketing or application page could be read.
  That challenge was NOT circumvented. Everything recorded here comes from hosts that
  answered normally (blog, support, GitHub) or from the HTTP status of an honest
  probe. No portal, endpoint, scope, specification or auth scheme has been inferred
  or invented to fill the record.
actions:
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    No public, self-serve API surface exists for Codafication. apis[] is deliberately
    empty and openapi/ is deliberately absent. For an Australian claims-tech vendor
    with no CDR insurance obligation, partner-gated with zero published API artifacts
    is the accurate finding and is the data point this data set exists to capture.
