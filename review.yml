limitations: |
  codafication.com and its application subdomains serve an anti-bot challenge to
  anonymous clients, so no first-party marketing or application page could be read.
  That challenge was NOT circumvented. Everything recorded here comes from hosts that
  answered normally (blog, support, GitHub) or from the HTTP status of an honest
  probe. No portal, endpoint, scope, specification or auth scheme has been inferred
  or invented to fill the record.
actions:
  apisListed: 1
  openapiDirectoryCreated: false
  reason: |
    REVISED 2026-07-25. apis[] now carries one entry - the Unity Platform API - because a
    real, anonymously reachable public API reference exists at https://docs.unitycloud.io/.
    No baseURL is recorded for it, deliberately: the host is the customer's own tenant
    Cloud domain (https://<CloudDomain>/graphql/v2/...), not a shared production host, and
    inventing one would be worse than the five rating points it costs. openapi/ remains
    deliberately absent - no OpenAPI, Swagger or AsyncAPI document exists first-party, and
    nothing was synthesised. The corrected posture for this Australian claims-tech vendor
    with no live CDR insurance obligation is: documented but partner-gated - a real SDK,
    GraphQL, REST-extension and webhook contract described in prose, with every
    machine-readable, self-serve and operational-transparency layer (spec, introspection,
    registry distribution, signup, status page, SLA, deprecation policy, changelog)
    missing.
  artifactsWritten:
  - authentication/codafication-authentication.yml
  - conventions/codafication-conventions.yml
  - asyncapi/codafication-unity-webhooks.yml
  - data-model/codafication-data-model.yml
  - packages/codafication-packages.yml
  - cli/codafication-cli.yml
  - components/codafication-components.yml
  - sandbox/codafication-sandbox.yml
  - conformance/codafication-conformance.yml
  - lifecycle/codafication-lifecycle.yml
