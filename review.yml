aid: codafication
name: Codafication
review:
  question: Does Codafication publish a public, self-serve developer portal or downloadable
    API definitions for its insurance claims platforms?
  answer: partial
  date: '2026-07-25'
  revised: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  gated: true
  revisionNote: |
    CORRECTION (enrichment round 2026-07-25). The first pass of this review enumerated
    only %.codafication.com and concluded that no public API reference existed. It does -
    on a SEPARATE REGISTRABLE DOMAIN. https://docs.unitycloud.io/ returns HTTP 200 and is
    the complete public "Unity Platform SDK" API Reference: a Slate single-page document
    (65,678 bytes, Last-Modified 2022-03-24, served from S3 behind CloudFront) covering the
    Portal SDK, the Node.js Unity SDK, the GraphQL client, setQueries/setMutations,
    setLinks/setTypeExtensions/setTypes, public and private REST endpoints, web hooks,
    logic hooks, and the platform services. Consequently the earlier statements "no public
    ... API reference ... or webhook catalog could be found" and "no docs subdomain
    resolves" are WRONG as scoped and are corrected below: the docs host is
    docs.unitycloud.io, not docs.codafication.com. What remains TRUE and unchanged: no
    OpenAPI/Swagger/AsyncAPI document, no anonymously introspectable GraphQL endpoint, no
    Postman collection, no public npm distribution of the SDKs, no self-serve signup, no
    status page, no SLA, no deprecation policy and no named OAuth scopes.
findings:
  summary: |
    Codafication is a Brisbane, Australia insurtech (founded 2015, Daniel Sandaver
    and Drew Butler) selling three products into the general insurance claims supply
    chain: Crunchwork (claims and project management platform), Virtual Assist
    (real-time video assessment / remote triage), and Unity Cloud (a GraphQL data
    and integration layer over legacy insurance systems). It is a claims-tech vendor,
    not a carrier or broker.

    There IS a public API reference, on a second registrable domain: https://docs.unitycloud.io/
    (HTTP 200) is the Unity Platform SDK reference. There is still NO self-serve developer
    portal - the Unity "Developer Portal" the reference repeatedly points at (for API
    Tokens, extension registration and the list of Unity webhook events) is an in-product,
    tenant-scoped screen with no public URL - and NO downloadable API definition of any
    kind. developer.codafication.com, developers.codafication.com, docs.codafication.com and
    api.codafication.com all fail to resolve (NXDOMAIN), as do developer.unitycloud.io,
    portal.unitycloud.io, app.unitycloud.io and api.unitycloud.io. Every path under
    codafication.com - including /developers, /api, /developer, /partners,
    /integrations, /robots.txt, /sitemap.xml and /.well-known/openid-configuration -
    is served behind a SiteGround bot wall that returns HTTP 202 with an
    `sg-captcha: challenge` header and a 169-byte JavaScript proof-of-work redirect
    body, for anonymous clients. No first-party marketing page could therefore be
    confirmed or classified from an anonymous probe, and no page was found that
    presents itself as a developer portal.

    The two first-party surfaces that ARE anonymously reachable are the Intercom
    knowledge base at https://support.codafication.com/en/ (HTTP 200) and the HubSpot
    blog at https://blog.codafication.com/ (HTTP 200). Both were harvested. The
    knowledge base is an END-USER help centre for Crunchwork, Virtual Assist and
    support - not API reference documentation. Its only "Integrations" collection
    (https://support.codafication.com/en/collections/2731128-integrations, 5 articles)
    documents Crunchwork CONSUMING third-party APIs, never Codafication exposing one:
    a Crunchwork-to-NetSuite sync, a one-way Crunchwork-to-Xero integration that
    explicitly requires "access to an authenticated Xero user for the API" and a
    Codafication-run setup engagement, the "ENData Scope API" for publishing quotes
    and variations to ENData with configurable unit/location/cost-item mapping, and
    Opus document submission. That is a configured, professional-services integration
    surface, not a self-serve API.

    Certificate transparency (crt.sh) for %.codafication.com returned exactly seven
    hosts: blog, crunchwork, go, helm, help, scim and unitycloud. Of these,
    crunchwork.codafication.com and unitycloud.codafication.com return the same
    HTTP 202 bot challenge (marketing hosts); helm.codafication.com returns HTTP 403
    from CloudFront (private Helm chart repository); scim.codafication.com resolves to
    34.116.97.51 but the TCP connection times out with no response, consistent with an
    IP-allowlisted enterprise SCIM provisioning endpoint rather than a public API;
    help.codafication.com returns 404; go.codafication.com does not resolve.

    Unity Cloud is architecturally a GraphQL layer - Codafication published
    "Why GraphQL is the future of insurance technology" (2022-02-24) and
    "How insurers stay APRA compliant with GraphQL security" (2021-08-12, on CPS 234)
    - but no public or introspectable GraphQL endpoint exists. Probes of
    /graphql on both unitycloud.codafication.com and crunchwork.codafication.com
    returned the bot challenge (HTTP 202, text/html), not a GraphQL surface, so no
    SDL was harvested and none was fabricated.

    The GitHub organisation github.com/Codafication is real (id 29222332, created
    2017-06-06, location "Brisbane, Australia", email team@codafication.com, 29 public
    repos). It contains no product, SDK or specification repository - 27 of 29 repos
    are forks of third-party open source (apollo-server, graphql-yoga, graphql-tools,
    subscriptions-transport-ws, typeorm, mediasoup, licode, xero-node,
    node-suitetalk, australia-address-parser), which corroborates the GraphQL /
    WebRTC / Xero / NetSuite stack but yields no API artifacts. The only two
    non-forks are an internal APM proof-of-concept and a hiring exercise.
  developerPortal:
    url: https://docs.unitycloud.io/
    confirmed: true
    classification: public-api-reference-without-self-serve-portal
    note: |
      CORRECTED. A public API reference exists at https://docs.unitycloud.io/ - the Unity
      Platform SDK documentation, reachable anonymously, returning HTTP 200. It is a
      reference, not a portal: there is no registration, no key issuance, no console, no
      try-it, no spec download and no support ticketing on it. The actual Unity Developer
      Portal (where API Tokens are created, extensions are registered with their pre-shared
      secret, and the list of Unity webhook events lives) is inside the customer's tenant
      Cloud and has no public URL. On codafication.com itself no developer surface exists:
      candidate subdomains do not resolve and candidate paths return the site-wide bot
      challenge.
    documentedSections:
    - Introduction / About the Unity Platform / Benefits
    - Developer Tooling - Prerequisites, Setup, Tools
    - Portal SDK - UnitySDK frontend wrapper, UnityBar, getUnityClient
    - Unity SDK - Unity Client, configuration, GraphQL client
    - GraphQL Queries and Mutations - setQueries, setMutations
    - GraphQL Extensions - setLinks, setTypeExtensions, setTypes
    - REST Endpoints - public and private, get/post/publicGet/publicPost
    - Web Hooks
    - Logic Hooks - beforeHook, afterHook
    - Services - Twilio SMS/VoIP, SendGrid/Office 365 email, Bitly short links
    - Starting the backend server
  acordPosture: no ACORD reference found
  acordEvidence: |
    Searched the full accessible corpus - the Intercom knowledge base search
    (https://support.codafication.com/en/search?q=ACORD returned zero articles), the
    Crunchwork, Virtual Assist, Support and Integrations collections, and every blog
    post reachable from https://blog.codafication.com/sitemap.xml - for ACORD, AL3,
    ACORD XML, ACORD certified and NGDS. Zero matches. IVANS, Vertafore and Applied
    Epic are US agency-download constructs and likewise do not appear. Codafication's
    documented interchange is instead with Australian claims-scoping and finance
    systems (ENData, Opus, NetSuite, Xero) and, at the architecture level, GraphQL.
  insuranceVerbs:
    quote:
      exposed: false
      note: Crunchwork has a Quotes module with quotes and variations, published to
        ENData via ENData's own Scope API. No Codafication quote API is documented.
    bind:
      exposed: false
      note: Not a product function - Codafication does not sell policies or place risk.
    issue:
      exposed: false
      note: Not a product function - no policy administration or issuance product.
    fnol:
      exposed: false
      note: |
        FNOL is a real product capability - Codafication describes "our automated
        forms platform for first notice of loss" and Crunchwork orchestrating the
        claim "from first notification of loss through to completion of repairs" -
        but it is delivered as partner-configured SaaS, with no public FNOL API,
        endpoint or definition published.
    audience: partner-only (insurers, assessors, builders, restorers and trades under
      contract; no consumer or open agent self-serve tier)
  authModel:
    scheme: Auth0 (OIDC, SAML 2.0 / Active Directory connections) + Unity API tokens + per-extension pre-shared secret
    documented: true
    docs: https://docs.unitycloud.io/#security
    artifact: authentication/codafication-authentication.yml
    note: |
      CORRECTED. The authentication model IS documented in the Unity Platform SDK
      reference. User authentication is handled by Auth0 across multiple connections
      (Active Directory, SAML 2.0), with the Portal SDK handling login, token renewal and
      authorization of the GraphQL client. Platform calls require a "Unity Token" created
      from Developer Portal > API Tokens. Backend extensions authenticate with a pre-shared
      authenticationSecret registered on both the extension and the Developer Portal.
      Private extension REST endpoints require an authorization header; public ones require
      none. Authorization is centralised RBAC in the Unity API with granular permissions in
      a multi-tenant environment - queries and mutations are secure by default, permissions
      group into tenant-scoped internal roles which map to the customer's own external
      directory roles. What is still NOT published: named scopes, and any machine-readable
      metadata. No OpenID Connect discovery document
      or OAuth authorization server metadata could be retrieved -
      /.well-known/openid-configuration and /.well-known/oauth-authorization-server on
      codafication.com, unitycloud.codafication.com and crunchwork.codafication.com all
      returned the HTTP 202 bot challenge. Product-level access is username/password
      login to a tenant "Cloud" with role-based access control and MFA (per the SOC 2
      Type II announcement of 2026-01-20); the existence of scim.codafication.com
      implies SCIM-based enterprise user provisioning, but that host does not respond
      to anonymous requests and its behaviour was NOT assumed or documented further.
  webhooks:
    documented: true
    catalogPublished: false
    asyncapi: false
    docs: https://docs.unitycloud.io/#web-hooks
    artifact: asyncapi/codafication-unity-webhooks.yml
    note: |
      CORRECTED. Webhooks ARE documented, and the model is unusual enough to be worth
      recording: in Unity a webhook subscribes to a Unity EVENT, and Unity events are
      MUTATIONS, so any extension's mutations are subscribable. Rather than a fixed payload,
      the subscriber supplies a GraphQL query that is executed when the event fires and the
      RESULT is delivered - which removes the follow-up read a conventional id-only webhook
      forces. Delivery is HTTP POST/PATCH/PUT to a caller-chosen URL. Documented use cases
      are triggering external workflows, mirroring Pulse data and downloading Virtual Assist
      sessions. Separately, logic hooks (unity.beforeHook / unity.afterHook, keyed on a
      mutation name) run in-process; a before hook can block or fail the mutation, an after
      hook cannot roll it back. What is still absent: the concrete event catalog, which
      lives only in the in-product Developer Portal, and any AsyncAPI document.
  postman:
    public: false
    note: A search of the Postman public network for "codafication" returned no
      Codafication-owned workspace, collection or team.
  graphql:
    publicEndpoint: false
    sdlHarvested: false
    documented: true
    docs: https://docs.unitycloud.io/#graphql-client
    note: |
      PARTIALLY CORRECTED. The GraphQL surface is now documented in detail - one collated
      endpoint (every installed extension's schema is merged centrally on the fly), strongly
      typed auto-generated `where` clauses, RBAC and multi-tenancy secure-by-default,
      queries/mutations registered via setQueries/setMutations, cross-extension type linking
      via setLinks and setTypeExtensions, and two client generations (`client` for the older
      GraphQL version, `clientV2` for new extensions, reachable via getUnityClientV2). Real
      query shapes appear in the reference: allUnityUsers(where: JSON) returning users with
      firstName/lastName/email/tenants{id}/permissions, and unityUser(id: ID!). The endpoint
      itself remains tenant-scoped (https://<CloudDomain>/graphql/v2/...) with no anonymous
      instance: /graphql, /api/graphql and /v1/graphql on both unitycloud.codafication.com
      and crunchwork.codafication.com return the HTTP 202 bot challenge to a POST
      introspection query, not a GraphQL response. NO SDL was harvested and none was
      fabricated.
  grpc:
    documented: false
  openapi:
    harvested: false
    count: 0
    note: |
      UNCHANGED AND RE-VERIFIED. No OpenAPI, Swagger or AsyncAPI document exists at any
      reachable first-party location. Re-probed this round against every host: /openapi.json,
      /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc on
      crunchwork.codafication.com and unitycloud.codafication.com all return the HTTP 202
      bot challenge; the same paths on docs.unitycloud.io return S3 AccessDenied (403
      application/xml) because it is a static single-page site with no such keys. The
      openapi/ directory remains deliberately absent rather than populated with anything
      synthesised.
  sdks:
    documented: true
    publiclyDistributed: false
    artifact: packages/codafication-packages.yml
    note: |
      NEW. Two first-party SDKs are named and used throughout the reference:
      @teamcodafication/unity-portal-sdk (React frontend / Portal SDK - the UnitySDK wrapper,
      UnityBar, Device Controller, getUnityClientV2) and @teamcodafication/unity-sdk (Node.js
      backend, built on graphql-yoga over express). Both return 404 on the public npm
      registry - distribution is partner-gated. A scope search of @teamcodafication returns
      exactly one public package, @teamcodafication/commit-analyzer 9.0.2-codafication.0
      (2023-02-11), a semantic-release plugin fork, not an API client. A first-party "Create
      Extension CLI" plus Minikube/kubectl setup scripts are documented but not distributed
      publicly and have no repository in the public GitHub org.
  transports:
  - protocol: HTTPS (marketing and application hosts)
    documented: false
    note: codafication.com, crunchwork.codafication.com and unitycloud.codafication.com
      answer over HTTPS but return an anti-bot challenge (HTTP 202, sg-captcha) to
      anonymous clients.
  - protocol: GraphQL
    documented: false
    note: Named in Codafication's own engineering blog as the Unity Cloud interface
      style. No public endpoint, schema or SDL published.
  - protocol: REST
    documented: false
    note: Codafication consumes third-party REST APIs (Xero, NetSuite, ENData Scope
      API) on behalf of customers. It does not publish one.
  - protocol: WebSocket / WebRTC
    documented: false
    note: Virtual Assist is a real-time video streaming product and the GitHub org
      forks mediasoup, licode and twilio-video samples, but no signalling or media
      API is documented for third parties.
  marketSeam: |
    Australia has the legal machinery for open insurance and no live obligation. APRA
    handles prudential supervision - Codafication engages that regime directly, having
    published on CPS 234 Information Security compliance - but the Consumer Data Right,
    which already opened banking and energy, was designated to extend to general
    insurance and then deferred and de-prioritized. There is therefore no forcing
    function that would make an Australian claims-tech platform publish a public API,
    and Codafication has not. Its integration story runs through named enterprise
    partnerships (IAG, Suncorp, Guidewire) and per-customer configured connectors, not
    through an open developer surface.
