  public_registry: true
  version: 9.0.2-codafication.0
  published: '2023-02-11'
  role: Build tooling (not an API client)
  description: >-
    Codafication's published fork of the semantic-release commit-analyzer plugin. The
    only @teamcodafication package publicly resolvable on npm; it is release tooling, not
